services:
  - type: web
    name: stock-terminal
    runtime: node
    plan: free
    buildCommand: npx --yes pnpm@9.15.9 install --no-frozen-lockfile && npx --yes pnpm@9.15.9 run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /tmp/atdevala
      - key: FINNHUB_API_KEY
        sync: false
